# Written by princo deploy; changes here are overwritten.
{{- with .EngineDomains}}

# The engine's domains: plain HTTP, only for ACME challenges.
server {
	listen 80;
	listen [::]:80;
	server_name{{range .}} {{.}}{{end}};
	location /.well-known/acme-challenge/ {
		root {{$.ACMEDir}};
	}
	location / {
		return 404;
	}
}
{{- end}}
{{- with .Site}}

# Subscription URLs grant access: no log records their requests.
server {
	listen 80;
	listen [::]:80;
	server_name {{.Domain}};
	access_log off;
	log_not_found off;
	location /.well-known/acme-challenge/ {
		root {{$.ACMEDir}};
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

{{- if $.SiteTLS}}

# The subscription site, behind the multiplexer.
server {
	listen {{.Listen}} ssl;
	server_name {{.Domain}};
	ssl_certificate {{$.CertDir}}/{{.Domain}}/fullchain.pem;
	ssl_certificate_key {{$.CertDir}}/{{.Domain}}/key.pem;
	root {{$.Root}};
	access_log off;
	log_not_found off;
	add_header X-Robots-Tag "noindex, nofollow" always;

	location ~ ^/([a-f0-9]+)/sing-box$ {
		default_type application/json;
		try_files /$1/sing-box/config =404;
	}
	location ~ ^/([a-f0-9]+)/qr$ {
		default_type text/html;
		try_files /$1/index.html =404;
	}
	# Named capture: the `if` regex below would reset $1.
	location ~ ^/(?<token>[a-f0-9]+)/?$ {
		# sing-box apps send "SFx (sing-box ...)": give them the profile so
		# the universal link works there too.
		if ($http_user_agent ~ "^SF[A-Z] \(sing-box") {
			rewrite ^ /$token/sing-box last;
		}
		default_type text/plain;
		# add_header here drops the server's.
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header profile-update-interval "24";
		add_header profile-title "{{.Domain}}";
		add_header profile-web-page-url "https://{{.Domain}}/$token/qr";
		try_files /$token/base64 =404;
	}
}
{{- end}}
{{- end}}
