# Written by princo deploy; changes here are overwritten.
{{- with .Mux}}
# The SNI multiplexer of node {{$.Node}} on TCP {{.Port}}.
stream {
{{- if .Loopback}}
	# The engine listens at both; nginx connects as the client's family.
	map $remote_addr $princo_loopback {
		~:      [::1];
		default 127.0.0.1;
	}
{{- end}}
	map $ssl_preread_server_name $princo_backend {
{{- range .Routes}}
		{{.SNI}} {{template "stream-target" .}};
{{- end}}
{{- with .Default}}
		default {{template "stream-target" .}};
{{- end}}
	}
{{- if .Loopback}}
	# nginx connects to the engine from the client's address.
	map $ssl_preread_server_name $princo_bind {
{{- range .Routes}}
		{{.SNI}} {{template "stream-bind" .}};
{{- end}}
{{- with .Default}}
		default {{template "stream-bind" .}};
{{- end}}
	}
{{- end}}
	server {
		listen {{.Port}};
		listen [::]:{{.Port}};
		ssl_preread on;
{{- if .Loopback}}
		proxy_bind $princo_bind transparent;
{{- end}}
		proxy_pass $princo_backend;
		# Tunnels idle longer than nginx's 10 minutes.
		proxy_timeout 1h;
	}
}
{{- else}}
# Node {{.Node}} has no multiplexer.
{{- end}}
{{- define "stream-target"}}{{if .EnginePort}}$princo_loopback:{{.EnginePort}}{{else}}{{.Target}}{{end}}{{end}}
{{- define "stream-bind"}}{{if .EnginePort}}$remote_addr{{else}}""{{end}}{{end}}
