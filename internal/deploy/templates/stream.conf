# Written by princo deploy; changes here are overwritten.
# The SNI multiplexer of node {{.Node}} on TCP {{.Mux.Port}}.
stream {
	map $ssl_preread_server_name $princo_backend {
{{- range .Mux.Routes}}
		{{.SNI}} {{.Target}};
{{- end}}
{{- with .Mux.Default}}
		default {{.}};
{{- end}}
	}
	server {
		listen {{.Mux.Port}};
		listen [::]:{{.Mux.Port}};
		ssl_preread on;
		proxy_pass $princo_backend;
	}
}
