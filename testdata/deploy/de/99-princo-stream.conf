# Written by princo deploy; changes here are overwritten.
# The SNI multiplexer of node de on TCP 443.
stream {
	map $ssl_preread_server_name $princo_backend {
		example.com 127.0.0.1:8443;
		subs.example.com 127.0.0.1:8443;
		naive-de.example.com 127.0.0.1:8445;
		default 127.0.0.1:8444;
	}
	server {
		listen 443;
		listen [::]:443;
		ssl_preread on;
		proxy_pass $princo_backend;
	}
}
