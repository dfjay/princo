# Written by princo deploy; changes here are overwritten.

# The engine's domains: plain HTTP, only for ACME challenges.
server {
	listen 80;
	listen [::]:80;
	server_name de.example.com naive-de.example.com;
	location /.well-known/acme-challenge/ {
		root /var/lib/princo/acme;
	}
	location / {
		return 404;
	}
}

# Subscription URLs grant access: no log records their requests.
server {
	listen 80;
	listen [::]:80;
	server_name subs.example.com;
	access_log off;
	log_not_found off;
	location /.well-known/acme-challenge/ {
		root /var/lib/princo/acme;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

# The subscription site, behind the multiplexer.
server {
	listen 127.0.0.1:8443 ssl;
	server_name subs.example.com;
	ssl_certificate /var/lib/princo/certs/subs.example.com/fullchain.pem;
	ssl_certificate_key /var/lib/princo/certs/subs.example.com/key.pem;
	root /var/lib/princo/files/subscription;
	access_log off;
	log_not_found off;
	add_header X-Robots-Tag "noindex, nofollow" always;

	location ~ ^/([a-f0-9]+)/sing-box$ {
		default_type application/json;
		try_files /$1/sing-box/config =404;
	}
	location ~ ^/([a-f0-9]+)/qr$ {
		default_type text/html;
		try_files /$1/index.html =404;
	}
	# Named capture: the `if` regex below would reset $1.
	location ~ ^/(?<token>[a-f0-9]+)/?$ {
		# sing-box apps send "SFx (sing-box ...)": give them the profile so
		# the universal link works there too.
		if ($http_user_agent ~ "^SF[A-Z] \(sing-box") {
			rewrite ^ /$token/sing-box last;
		}
		default_type text/plain;
		# add_header here drops the server's.
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header profile-update-interval "24";
		add_header profile-title "subs.example.com";
		add_header profile-web-page-url "https://subs.example.com/$token/qr";
		try_files /$token/base64 =404;
	}
}
